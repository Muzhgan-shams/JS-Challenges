<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>
  <body>
    <main class="todo-app">
      <h1>My Todo List</h1>
      <form id="todoForm">
        <input
          type="text"
          id="todoInput"
          placeholder="Add a todo..."
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>
      <p id="errorMessage" class="error-message"></p>
      <div class="filters">
        <button type="button" class="filter-button active" data-filter="all">
          All
        </button>

        <button type="button" class="filter-button" data-filter="active">
          Active
        </button>

        <button type="button" class="filter-button" data-filter="completed">
          Completed
        </button>
      </div>
      <p id="todoCount">0 items left</p>
      <ul id="todoList"></ul>
    </main>
  </body>
</html>
