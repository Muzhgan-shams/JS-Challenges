<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 40px 20px;
      }

      .todo-app {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 24px;
        border-radius: 8px;
      }

      #todoForm {
        display: flex;
        gap: 8px;
      }

      #todoInput {
        flex: 1;
        padding: 10px;
      }

      button {
        cursor: pointer;
        padding: 8px 12px;
      }

      .error-message {
        color: red;
        min-height: 20px;
      }

      .filters {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }

      .filter-button.active {
        background: #333;
        color: white;
      }

      #todoList {
        padding: 0;
        list-style: none;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
      }

      .todo-text {
        flex: 1;
      }

      .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: #888;
      }
    </style>
  </head>
  <body>
    <main class="todo-app">
      <h1>My Todo List</h1>
      <form id="todoForm">
        <input
          type="text"
          id="todoInput"
          placeholder="Add a todo..."
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>
      <p id="errorMessage" class="error-message"></p>
      <div class="filters">
        <button type="button" class="filter-button active" data-filter="all">
          All
        </button>

        <button type="button" class="filter-button" data-filter="active">
          Active
        </button>

        <button type="button" class="filter-button" data-filter="completed">
          Completed
        </button>
      </div>
      <p id="todoCount">0 items left</p>
      <ul id="todoList"></ul>
    </main>
  </body>
</html>
